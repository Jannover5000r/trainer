# Trainer stack for Coolify (Docker Compose application).
# Set TRAINER_JWT_SECRET in the Coolify UI.

services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: trainer:latest
    container_name: trainer
    restart: unless-stopped

    # Port Coolify's proxy routes to.
    expose:
      - "8080"
    # For plain local `docker compose up`, publish a host port instead:
    # ports:
    #   - "8080:8080"

    environment:
      TRAINER_ADDR: ":8080"
      TRAINER_DB: "/app/data/trainer.db"
      TRAINER_STATIC: "/app/web/static"
      TRAINER_TOKEN_TTL: "720h"
      TRAINER_COOKIE_SECURE: "true"
      TRAINER_JWT_SECRET: "${TRAINER_JWT_SECRET:?TRAINER_JWT_SECRET must be set}"

    volumes:
      # Persistent SQLite database.
      - ./data:/app/data
      # - trainer-data:/app/data

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 32M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

