name: Android APK

# Push a tag like v1.0.0 to build a signed release APK and attach it (plus its
# SHA-256) to the GitHub Release. workflow_dispatch builds an artifact only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for a manual build"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build offline WASM core
        run: bash scripts/build-wasm.sh

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TRAINER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRAINER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRAINER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/trainer-release.jks"
            export TRAINER_KEYSTORE_PATH="$RUNNER_TEMP/trainer-release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - APK will be debug-signed."
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Collect APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/trainer-${VERSION}.apk"
          (cd dist && sha256sum "trainer-${VERSION}.apk" > "trainer-${VERSION}.apk.sha256")
          ls -la dist

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: trainer-apk-${{ github.run_number }}
          path: dist/*

      - name: Publish GitHub release (tag runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
